[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "liquid-time-constant-networks"
version = "0.1.0"
description = "Liquid time-constant recurrent networks in PyTorch, with an MFCC front end for speech"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Rahul (Riki) Singh" }]
keywords = ["liquid-neural-networks", "ltc", "continuous-time-rnn", "speech", "mfcc", "pytorch"]
dependencies = ["torch>=2.0", "numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
viz = ["matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
